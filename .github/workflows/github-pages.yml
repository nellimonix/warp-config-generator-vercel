name: Deploy static site to GitHub Pages

on:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: '1'
      NEXT_PUBLIC_API_BASE_URL: https://api.llimonix.pw
      NEXT_PUBLIC_RYBBIT_ANALYTICS_SITE_ID: ${{ secrets.NEXT_PUBLIC_RYBBIT_ANALYTICS_SITE_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
